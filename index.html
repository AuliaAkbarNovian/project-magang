<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Character UI Profile</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #1f1a17;
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

  <main class="relative w-full max-w-5xl min-h-[650px] overflow-hidden rounded-3xl border border-yellow-200/30 bg-gradient-to-b from-[#2b241f] to-[#9b7a52] text-white shadow-2xl">

    <!-- Border dekoratif -->
    <div class="absolute inset-4 border border-yellow-100/30 rounded-2xl pointer-events-none"></div>

    <!-- Background blur -->
    <div class="absolute inset-0 bg-black/25"></div>

    <section class="relative z-10 grid grid-cols-1 md:grid-cols-2 gap-8 p-8 md:p-14">

      <!-- LEFT CONTENT -->
      <div class="space-y-8">
        <div>
          <h1 class="text-7xl md:text-8xl font-black italic tracking-tight">
            UI
          </h1>

          <div class="mt-6 inline-block bg-[#f2dfbd] text-[#1f1a17] px-6 py-3 rounded-r-full">
            <p class="font-semibold leading-tight">
              Trinity General School<br>
              3rd Year<br>
              Library Committee
            </p>
          </div>
        </div>

        <!-- Mini portraits -->
        <div class="space-y-4">
          <img src="ui1.png" class="w-28 h-28 object-cover rounded-xl border-4 border-white/80">
          <img src="ui1.png" class="w-28 h-28 object-cover rounded-xl border-4 border-white/80">
          <img src="ui1.png" class="w-28 h-28 object-cover rounded-xl border-4 border-white/80">
        </div>
      </div>

      <!-- RIGHT CHARACTER -->
      <div class="relative flex items-center justify-center">
        <div class="absolute top-4 right-4 text-right">
          <p class="text-2xl md:text-3xl font-bold">
            “Please,<br>keep it down...”
          </p>
        </div>

        <img
          src="ui.png"
          alt="Character"
          class="relative mt-20 md:mt-10 max-h-[560px] object-contain drop-shadow-2xl"
        >
      </div>

    </section>

    <!-- Bottom Description -->
    <section class="relative z-10 px-8 md:px-14 pb-10">
      <div class="max-w-3xl">
        <h2 class="text-2xl font-semibold mb-2">
          Trinity Library Committee's Director.
        </h2>

        <p class="text-lg leading-relaxed text-white/90">
          A quiet student who loves books and spends most of her time in the old
          library, taking care of ancient texts and historical records.
        </p>
      </div>

      <h3 class="text-center mt-8 text-2xl font-bold">
        Blue<span class="text-cyan-300">Archive</span>
      </h3>
    </section>

  </main>

</body>
</html>
